<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        .toggle-btn {
            background: #2196F3;
            margin-top: 10px;
        }

        .toggle-btn:hover {
            background: #0b7dda;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            color: red;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="form-title">Login</h2>
        <form id="form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" class="hidden">
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Login</button>
        </form>
        <button class="toggle-btn" id="toggle-btn">Switch to Registration</button>
        <p class="message" id="message"></p>
    </div>

    <script>
    const form = document.getElementById('form');
    const toggleBtn = document.getElementById('toggle-btn');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const message = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    let isLogin = true;

    toggleBtn.addEventListener('click', () => {
        isLogin = !isLogin;
        if (isLogin) {
            formTitle.textContent = "Login";
            submitBtn.textContent = "Login";
            toggleBtn.textContent = "Switch to Registration";
            emailInput.classList.add('hidden');
        } else {
            formTitle.textContent = "Registration";
            submitBtn.textContent = "Register";
            toggleBtn.textContent = "Switch to Login";
            emailInput.classList.remove('hidden');
        }
        message.textContent = '';
        form.reset();
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const email = emailInput.value.trim();

        if (isLogin) {
            
            const savedUsername = localStorage.getItem("username");
            const savedPassword = localStorage.getItem("password");

            if (username === savedUsername && password === savedPassword) {
                message.style.color = "green";
                message.textContent = "Login Successful!";
            } else {
                message.style.color = "red";
                message.textContent = "Invalid username or password!";
            }

        } else {
        
            if (username && email && password) {
                localStorage.setItem("username", username);
                localStorage.setItem("password", password);

                message.style.color = "green";
                message.textContent = "Registration Successful! You can now login.";

                setTimeout(() => {
                    toggleBtn.click();
                }, 1500);
            } else {
                message.style.color = "red";
                message.textContent = "Please fill all fields!";
            }
        }
    });
</script>

</body>
</html>
